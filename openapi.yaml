openapi: 3.1.0
info:
  title: Vivant Valley Hosted AI API
  version: 0.1.0-contract
  license:
    name: Proprietary contract draft
    identifier: LicenseRef-Proprietary
  description: |
    Phase-1 contract for the hosted Vivant Valley service. LiteLLM and all
    provider credentials are private implementation details. Monetary values
    are integer credit_micros; request and response bodies must not contain
    secrets.
servers:
  - url: https://api.example.invalid
    description: Replace with the production HTTPS origin
tags:
  - name: Auth
    description: Web account registration and sessions
  - name: Console
    description: User wallet, usage and redemption views
  - name: Device keys
    description: One-time device credential lifecycle
  - name: OpenAI compatibility
    description: Bearer-key chat and model endpoints used by the Mod
  - name: Future game turns
    description: Reserved structured-context API
  - name: Admin
    description: Operations requiring both an administrator session and the ADMIN_PAGE_PASSWORD gate cookie
paths:
  /health:
    get:
      tags: [Console]
      operationId: health
      summary: Check service health
      security: []
      responses:
        '200':
          description: Service and dependency liveness (without secrets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/UpstreamError' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Register a web account
      description: Invitation code is required when registration_invite_required is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and authenticated session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a web session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session; sets a Secure HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /api/v1/auth/config:
    get:
      tags: [Auth]
      operationId: getAuthConfig
      summary: Read public registration settings
      security: []
      responses:
        '200':
          description: Public settings needed to render registration
          content:
            application/json:
              schema:
                type: object
                required: [invitation_required]
                properties:
                  invitation_required: { type: boolean }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current web session
      security:
        - SessionCookie: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/mod/auth/register:
    post:
      tags: [Auth]
      operationId: modRegister
      security: []
      summary: Register a Mod hosted account and return an opaque session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '201':
          description: Hosted Mod session
          content: { application/json: { schema: { $ref: '#/components/schemas/ModAuthSession' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/mod/auth/login:
    post:
      tags: [Auth]
      operationId: modLogin
      security: []
      summary: Log in from the Mod without exposing provider credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Hosted Mod session
          content: { application/json: { schema: { $ref: '#/components/schemas/ModAuthSession' } } }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/mod/bootstrap:
    get:
      tags: [Auth]
      operationId: modBootstrap
      summary: Read the current account wallet and public model catalog
      security: [{ ModBearer: [] }]
      responses:
        '200': { description: Account and model catalog }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/mod/redeem:
    post:
      tags: [Console]
      operationId: modRedeem
      summary: Redeem a credit code from inside the Mod
      security: [{ ModBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200': { description: Updated wallet }
        '401': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/me:
    get:
      tags: [Console]
      operationId: getCurrentUser
      summary: Get the current account
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/catalog:
    get:
      tags: [Console]
      operationId: getModelCatalog
      summary: List public model aliases and prices for the current account
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Public hosted-service connection values and model catalog
          content:
            application/json:
              schema:
                type: object
                required: [base_url, items]
                properties:
                  base_url: { type: string, format: uri }
                  items:
                    type: array
                    items:
                      type: object
                      required: [alias, max_input_tokens, max_output_tokens, input_micros_per_1k, output_micros_per_1k]
                      properties:
                        alias: { type: string }
                        max_input_tokens: { type: integer }
                        max_output_tokens: { type: integer }
                        input_micros_per_1k: { type: integer }
                        output_micros_per_1k: { type: integer }
                        cached_input_micros_per_1k: { type: integer }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/usage:
    get:
      tags: [Console]
      operationId: getUsage
      summary: List personal usage
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Redacted usage records and aggregate token/cost totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePage'
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/ledger:
    get:
      tags: [Console]
      operationId: getLedger
      summary: List wallet ledger entries
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Wallet balance and append-only ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/keys:
    get:
      tags: [Device keys]
      operationId: listDeviceKeys
      summary: List device keys
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Keys without plaintext secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceKey' }
        '401': { $ref: '#/components/responses/AuthError' }
    post:
      tags: [Device keys]
      operationId: createDeviceKey
      summary: Create a device key
      security:
        - SessionCookie: []
      description: Plaintext key is returned exactly once and is never retrievable later.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceKeyRequest'
      responses:
        '201':
          description: Created key; plaintext is present only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDeviceKey'
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /api/v1/keys/{keyId}:
    delete:
      tags: [Device keys]
      operationId: revokeDeviceKey
      summary: Revoke a device key
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Key revoked (idempotent) }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/redeem:
    post:
      tags: [Console]
      operationId: redeemCode
      summary: Redeem a credit code
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Code redeemed and credits added exactly once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /v1/models:
    get:
      tags: [OpenAI compatibility]
      operationId: listModels
      summary: List public model aliases
      security:
        - DeviceBearer: []
      responses:
        '200':
          description: Public allow-listed model aliases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401': { $ref: '#/components/responses/DeviceAuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/chat/completions:
    post:
      tags: [OpenAI compatibility]
      operationId: createChatCompletion
      summary: Create a chat completion
      security:
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              ordinary:
                value:
                  model: vv-dialogue
                  messages:
                    - role: system
                      content: You are an NPC.
                    - role: user
                      content: Hello!
                  max_tokens: 512
                  stream: false
              tool_round:
                value:
                  model: vv-dialogue
                  messages:
                    - role: system
                      content: Choose a permitted action.
                    - role: user
                      content: I would like to travel.
                  tools:
                    - type: function
                      function:
                        name: move_to
                        description: Start an agreed journey.
                        parameters:
                          type: object
                          properties:
                            destination_key: { type: string }
                          required: [destination_key]
                          additionalProperties: false
                  tool_choice: auto
                  stream: false
      responses:
        '200':
          description: Chat completion or an SSE stream when stream=true
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
            X-Balance-Micros:
              schema: { type: integer, format: int64 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
            text/event-stream:
              schema:
                type: string
                description: 'data: JSON chunks followed by data: [DONE]'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/DeviceAuthError' }
        '402':
          description: Balance or spend limit is insufficient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '408': { $ref: '#/components/responses/TimeoutError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413':
          description: Request body is too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/UpstreamError' }
  /api/v1/game/turn:
    post:
      tags: [Future game turns]
      operationId: createGameTurn
      summary: Create a structured game turn (reserved)
      description: |
        Reserved phase-2 endpoint. It keeps the same device-key auth,
        idempotent billing and model aliases as chat completions, but lets the
        server select fields, maintain a summary and execute a bounded tool
        round. It is not implemented in phase 1.
      security:
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameTurnRequest' }
      responses:
        '200':
          description: Structured NPC turn result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameTurnResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/DeviceAuthError' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '501':
          description: Reserved but not implemented in phase 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/access:
    post:
      tags: [Admin]
      operationId: unlockAdminConsole
      summary: Unlock the administrator console with its environment password
      description: |
        Verifies ADMIN_PAGE_PASSWORD with rate limiting, starts an administrator
        session and sets the HttpOnly administrator gate cookie. The password is
        never stored in the database or returned by the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
              additionalProperties: false
      responses:
        '200':
          description: Administrator session and gate cookie created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ProviderError' }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List users for administration
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, deleted] }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Paginated users and wallet summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create a support user
      description: Optional operational endpoint for creating a support account.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/admin/users/{userId}:
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Update user status or role
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended, deleted] }
                role: { type: string, enum: [user, admin] }
              minProperties: 1
              additionalProperties: false
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/admin/users/{userId}/credits:
    post:
      tags: [Admin]
      operationId: adminTopUp
      summary: Add manual credits to a user
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpRequest' }
      responses:
        '200':
          description: New wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/admin/keys/{keyId}:
    delete:
      tags: [Admin]
      operationId: adminRevokeDeviceKey
      summary: Revoke any device key
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Key revoked (idempotent) }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/admin/redeem-codes:
    post:
      tags: [Admin]
      operationId: adminCreateRedeemCode
      summary: Create a one-time redeem code
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRedeemCodeRequest' }
      responses:
        '201':
          description: Code shown once to the administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedRedeemCode' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/invitations:
    post:
      tags: [Admin]
      operationId: adminCreateInvitation
      summary: Create an invitation code
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitation code shown once to the administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/usage:
    get:
      tags: [Admin]
      operationId: adminUsage
      summary: View aggregate provider costs
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: model_alias
          in: query
          schema: { type: string, pattern: '^vv-[a-z0-9-]+$' }
      responses:
        '200':
          description: Aggregated cost and margin data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUsage' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/providers:
    get:
      tags: [Admin]
      operationId: adminListProviders
      summary: List managed upstream providers without secrets
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Provider metadata and masked key hints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProvider' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Admin]
      operationId: adminCreateProvider
      summary: Add an encrypted upstream API credential
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProviderRequest' }
      responses:
        '201':
          description: Created provider; the API key is not returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProvider' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/providers/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateProvider
      summary: Update provider metadata or rotate its API key
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProviderRequest' }
      responses:
        '200':
          description: Updated provider metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProvider' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Admin]
      operationId: adminDeleteProvider
      summary: Delete an unused managed provider
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Provider deleted }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/admin/providers/{id}/test:
    post:
      tags: [Admin]
      operationId: adminTestProvider
      summary: Probe upstream Chat Completions and forced tool-call compatibility
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Provider returned a valid forced tool call; this probe may consume a small number of upstream tokens
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /api/v1/admin/models:
    get:
      tags: [Admin]
      operationId: adminListModels
      summary: List routes and prices
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Alias routing and current price versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminModel' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/models/{alias}:
    patch:
      tags: [Admin]
      operationId: adminUpdateModel
      summary: Update a route and create a price version
      security:
        - SessionCookie: []
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, pattern: '^vv-[a-z0-9-]+$' }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelRequest' }
      responses:
        '200':
          description: Updated alias route and price version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminModel' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/admin/settings/registration:
    patch:
      tags: [Admin]
      operationId: adminSetRegistrationGate
      summary: Toggle invitation-only registration
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_required]
              properties:
                invite_required: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: Updated registration setting
          content:
            application/json:
              schema:
                type: object
                required: [invite_required]
                properties:
                  invite_required: { type: boolean }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/settings/runtime:
    get:
      tags: [Admin]
      operationId: adminGetRuntimeSettings
      summary: Read the persisted runtime mode
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current runtime mode
          content:
            application/json:
              schema:
                type: object
                required: [demo_mode]
                properties:
                  demo_mode: { type: boolean }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    patch:
      tags: [Admin]
      operationId: adminSetRuntimeSettings
      summary: Toggle Demo versus real upstream traffic
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [demo_mode]
              properties:
                demo_mode: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: Updated runtime mode
          content:
            application/json:
              schema:
                type: object
                required: [demo_mode]
                properties:
                  demo_mode: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: vv_live_device_key
      description: Plaintext vv_live_ device key created in the web console.
    ModBearer:
      type: http
      scheme: bearer
      bearerFormat: vv_mod_session
      description: Opaque hosted-account session token issued to the Mod; never an upstream provider key.
    SessionCookie:
      type: apiKey
      in: cookie
      name: vv_session
      description: Secure HttpOnly web session cookie; mutating calls also need X-CSRF-Token.
    AdminGateCookie:
      type: apiKey
      in: cookie
      name: vv_admin_gate
      description: HttpOnly cookie issued after ADMIN_PAGE_PASSWORD verification; required with an administrator session.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 1..128 character client-generated key; reused requests return the original result.
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client correlation ID; server generates a UUID when absent.
      schema: { type: string, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    ValidationError:
      description: Invalid JSON, field, tool schema, alias or limit
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    AuthError:
      description: Missing or invalid web session
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    DeviceAuthError:
      description: Missing, revoked or expired device key
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    ForbiddenError:
      description: Suspended account, disabled key or insufficient role
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    NotFoundError:
      description: Resource not found
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    ConflictError:
      description: Duplicate email, idempotency conflict or already consumed code
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    RateLimitError:
      description: RPM or concurrent-request limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    TimeoutError:
      description: Provider deadline exceeded; reservation released
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    UpstreamError:
      description: Internal LiteLLM/provider failure; reservation released or pending reconciliation
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    InsufficientBalance:
      description: Insufficient available credits
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string, enum: [validation_error, auth_error, billing_error, rate_limit_error, upstream_error, conflict_error, forbidden_error, timeout_error] }
            code: { type: string, examples: [insufficient_balance, invalid_device_key, stream_not_supported] }
            param: { type: [string, 'null'] }
            request_id: { type: string, format: uuid }
          additionalProperties: false
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [ok, degraded, unavailable] }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        invitation_code: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 256, writeOnly: true }
      additionalProperties: false
    AuthSession:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string, readOnly: true }
    ModAuthSession:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, pattern: '^vv_mod_' }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, role, status, created_at, wallet]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        wallet: { $ref: '#/components/schemas/Wallet' }
    Wallet:
      type: object
      required: [available_micros, reserved_micros, currency]
      properties:
        available_micros: { type: integer, format: int64, minimum: 0 }
        reserved_micros: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, example: credit_micros }
    CreateDeviceKeyRequest:
      type: object
      properties:
        label: { type: string, maxLength: 80 }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    DeviceKey:
      type: object
      required: [id, display_prefix, label, created_at, revoked]
      properties:
        id: { type: string, format: uuid }
        display_prefix: { type: string, pattern: '^vv_live_[A-Za-z0-9_-]{4,}$' }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked: { type: boolean }
    CreatedDeviceKey:
      allOf:
        - $ref: '#/components/schemas/DeviceKey'
        - type: object
          required: [key]
          properties:
            key: { type: string, pattern: '^vv_live_[A-Za-z0-9_-]{32,}$', writeOnly: true }
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { type: string, pattern: '^vv-[a-z0-9-]+$' }
        object: { type: string, enum: [model] }
        owned_by: { type: string, example: vivantvalley }
        permission: { type: array, items: { type: string } }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data: { type: array, items: { $ref: '#/components/schemas/Model' } }
    ChatMessage:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: 'null'
            - type: array
              items:
                type: object
                required: [type]
                properties:
                  type: { type: string }
                  text: { type: string }
                additionalProperties: true
        name: { type: string, maxLength: 128 }
        tool_call_id: { type: string, maxLength: 256 }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
      additionalProperties: false
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string, maxLength: 256 }
        type: { type: string, enum: [function] }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string, maxLength: 128 }
            arguments:
              oneOf:
                - type: string
                - type: object
          additionalProperties: false
      additionalProperties: false
    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type: { type: string, enum: [function] }
        function:
          type: object
          required: [name, parameters]
          properties:
            name: { type: string, maxLength: 128 }
            description: { type: string, maxLength: 4000 }
            parameters: { type: object, additionalProperties: true }
          additionalProperties: false
      additionalProperties: false
    ToolChoice:
      oneOf:
        - type: string
          enum: [none, auto, required]
        - type: object
          required: [type, function]
          properties:
            type: { type: string, enum: [function] }
            function:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 128 } }
              additionalProperties: false
          additionalProperties: false
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, pattern: '^vv-[a-z0-9-]+$', maxLength: 64 }
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream: { type: boolean, default: false }
        tools:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/ToolDefinition' }
        tool_choice: { $ref: '#/components/schemas/ToolChoice' }
        max_tokens: { type: integer, minimum: 1, maximum: 8192 }
        max_completion_tokens: { type: integer, minimum: 1, maximum: 8192 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        thinking:
          type: object
          description: Accepted for client compatibility; hosted routing forces non-thinking mode upstream.
          properties: { type: { type: string, enum: [enabled, disabled] } }
          additionalProperties: false
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          description: Accepted for client compatibility but ignored while hosted routing is in non-thinking mode.
        enable_thinking:
          type: boolean
          description: Accepted for client compatibility; hosted routing forces this behavior off upstream.
        user: { type: string, maxLength: 128 }
      additionalProperties: false
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer, format: int64 }
        model: { type: string, pattern: '^vv-[a-z0-9-]+$' }
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer, minimum: 0 }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'], enum: [stop, length, tool_calls, content_filter, 'null'] }
        usage: { $ref: '#/components/schemas/Usage' }
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        prompt_tokens_details:
          type: object
          properties: { cached_tokens: { type: integer, minimum: 0 } }
          additionalProperties: false
    UsageItem:
      type: object
      required: [request_id, model_alias, status, created_at, usage, cost_micros]
      properties:
        request_id: { type: string, format: uuid }
        model_alias: { type: string }
        status: { type: string, enum: [completed, failed, usage_pending, rejected] }
        created_at: { type: string, format: date-time }
        usage: { $ref: '#/components/schemas/Usage' }
        cost_micros: { type: integer, format: int64, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        error_code: { type: [string, 'null'] }
    UsagePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UsageItem' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        totals:
          type: object
          required: [prompt_tokens, completion_tokens, cost_micros]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            cost_micros: { type: integer, format: int64, minimum: 0 }
    LedgerEntry:
      type: object
      required: [id, kind, amount_micros, balance_after_micros, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [admin_topup, redeem, reservation, settlement, release, adjustment] }
        amount_micros: { type: integer, format: int64 }
        balance_after_micros: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        request_id: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
    LedgerPage:
      type: object
      required: [wallet, items, page, page_size, total]
      properties:
        wallet: { $ref: '#/components/schemas/Wallet' }
        items: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    TopUpRequest:
      type: object
      required: [amount_micros, reason]
      properties:
        amount_micros: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false
    CreateRedeemCodeRequest:
      type: object
      required: [value_micros, max_uses]
      properties:
        value_micros: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
        max_uses: { type: integer, minimum: 1, maximum: 100000 }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    CreateInvitationRequest:
      type: object
      required: [max_uses]
      properties:
        max_uses: { type: integer, minimum: 1, maximum: 100000 }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    CreatedInvitation:
      type: object
      required: [id, code, display_prefix, max_uses]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, writeOnly: true }
        display_prefix: { type: string }
        max_uses: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
    CreatedRedeemCode:
      type: object
      required: [id, code, display_prefix, value_micros, max_uses]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, writeOnly: true }
        display_prefix: { type: string }
        value_micros: { type: integer, format: int64 }
        max_uses: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
    AdminCreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        role: { type: string, enum: [user, admin], default: user }
      additionalProperties: false
    AdminUserPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    AdminUsage:
      type: object
      required: [from, to, requests, provider_cost_micros, user_charge_micros]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer, minimum: 0 }
        provider_cost_micros: { type: integer, format: int64, minimum: 0 }
        user_charge_micros: { type: integer, format: int64, minimum: 0 }
        margin_micros: { type: integer, format: int64 }
    AdminProvider:
      type: object
      required: [id, name, baseUrl, defaultModel, enabled, keyHint, source]
      properties:
        id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri }
        defaultModel: { type: string }
        enabled: { type: boolean }
        keyHint: { type: string, description: Masked key prefix/suffix only }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        lastCheckStatus: { type: [string, 'null'] }
        source: { type: string, enum: [managed, environment] }
    CreateProviderRequest:
      type: object
      required: [name, base_url, api_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url: { type: string, format: uri, description: HTTPS API root; local HTTP is allowed only for loopback testing }
        default_model: { type: string, maxLength: 128 }
        api_key: { type: string, minLength: 1, writeOnly: true }
        enabled: { type: boolean, default: true }
      additionalProperties: false
    UpdateProviderRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url: { type: string, format: uri }
        default_model: { type: string, maxLength: 128 }
        api_key: { type: string, minLength: 1, writeOnly: true }
        clear_api_key: { type: boolean }
        enabled: { type: boolean }
      additionalProperties: false
    AdminModel:
      type: object
      required: [alias, provider, provider_model, enabled, limits, price]
      properties:
        alias: { type: string, pattern: '^vv-[a-z0-9-]+$' }
        provider: { type: string }
        provider_model: { type: string, description: Internal value; never expose to untrusted clients }
        enabled: { type: boolean }
        limits:
          type: object
          required: [max_input_tokens, max_output_tokens, timeout_ms, rpm_limit, concurrency_limit]
          properties:
            max_input_tokens: { type: integer, minimum: 1 }
            max_output_tokens: { type: integer, minimum: 1 }
            timeout_ms: { type: integer, minimum: 1000 }
            rpm_limit: { type: integer, minimum: 1 }
            concurrency_limit: { type: integer, minimum: 1 }
          additionalProperties: false
        price: { $ref: '#/components/schemas/Price' }
    Price:
      type: object
      required: [id, input_micros_per_1k, output_micros_per_1k, cached_input_micros_per_1k, effective_from]
      properties:
        id: { type: string, format: uuid }
        input_micros_per_1k: { type: integer, format: int64, minimum: 0 }
        output_micros_per_1k: { type: integer, format: int64, minimum: 0 }
        cached_input_micros_per_1k: { type: integer, format: int64, minimum: 0 }
        effective_from: { type: string, format: date-time }
    UpdateModelRequest:
      type: object
      required: [provider, provider_model, enabled, limits, price]
      properties:
        provider: { type: string, minLength: 1, maxLength: 128 }
        provider_model: { type: string, minLength: 1, maxLength: 256 }
        enabled: { type: boolean }
        limits:
          type: object
          required: [max_input_tokens, max_output_tokens, timeout_ms, rpm_limit, concurrency_limit]
          properties:
            max_input_tokens: { type: integer, minimum: 1 }
            max_output_tokens: { type: integer, minimum: 1 }
            timeout_ms: { type: integer, minimum: 1000 }
            rpm_limit: { type: integer, minimum: 1 }
            concurrency_limit: { type: integer, minimum: 1 }
          additionalProperties: false
        price:
          type: object
          required: [input_micros_per_1k, output_micros_per_1k, cached_input_micros_per_1k]
          properties:
            input_micros_per_1k: { type: integer, format: int64, minimum: 0 }
            output_micros_per_1k: { type: integer, format: int64, minimum: 0 }
            cached_input_micros_per_1k: { type: integer, format: int64, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    GameTurnRequest:
      type: object
      required: [conversation_id, request_id, model, npc, player_input, context]
      properties:
        conversation_id: { type: string, minLength: 1, maxLength: 128 }
        request_id: { type: string, minLength: 1, maxLength: 128 }
        model: { type: string, pattern: '^vv-[a-z0-9-]+$' }
        npc:
          type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 128 }
            display_name: { type: string, maxLength: 128 }
          additionalProperties: false
        player_input: { type: string, minLength: 1, maxLength: 8000 }
        context:
          type: object
          description: Versioned typed game context; server chooses fields for prompting.
          required: [schema_version, context_version]
          properties:
            schema_version: { type: integer, enum: [1] }
            context_version: { type: string, maxLength: 64 }
            identity: { type: string, maxLength: 8000 }
            personality: { type: string, maxLength: 8000 }
            mood: { type: string, maxLength: 2000 }
            relationship: { type: string, maxLength: 4000 }
            goal: { type: string, maxLength: 4000 }
            world_state: { type: string, maxLength: 8000 }
            player_progress: { type: string, maxLength: 8000 }
            memory_summary: { type: string, maxLength: 8000 }
            recent_session_facts: { type: array, maxItems: 32, items: { type: string, maxLength: 1000 } }
            recent_messages: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ChatMessage' } }
            scene_snapshot: { type: string, maxLength: 4000 }
            activity_summary: { type: string, maxLength: 4000 }
            allowed_tools: { type: array, maxItems: 32, items: { type: object, additionalProperties: true } }
            allowed_move_destinations: { type: array, maxItems: 32, items: { type: object, additionalProperties: true } }
            day: { type: integer, minimum: 0 }
            location: { type: string, maxLength: 256 }
          additionalProperties: false
        tools:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/ToolDefinition' }
      additionalProperties: false
    GameTurnResponse:
      type: object
      required: [request_id, conversation_id, context_version, reply, memory_update, usage]
      properties:
        request_id: { type: string }
        conversation_id: { type: string }
        context_version: { type: string }
        reply: { type: string }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/ToolCall' } }
        memory_update:
          type: object
          properties:
            summary_patch: { type: string, maxLength: 320 }
            topics: { type: array, items: { type: string, maxLength: 64 } }
            open_loops: { type: array, items: { type: string, maxLength: 96 } }
          additionalProperties: false
        usage: { $ref: '#/components/schemas/Usage' }
